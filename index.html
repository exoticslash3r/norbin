<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norbin</title>
    
    <!-- Security Headers (these will be applied by server) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.firebaseapp.com https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com; script-src 'self' https://*.firebaseapp.com https://*.firebaseio.com https://*.googleapis.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.firebaseapp.com https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com;">
    
    <style>
        /* YOUR EXISTING CSS - Keep all your original styles here */
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --card-bg: #111111;
            --border-color: #333333;
            --hover-color: #222222;
            --table-header-bg: #000000;
            --table-row-alt: #000000;
            --table-border: #2aa2a;
            --link-color: #4dabf7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #000000;
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Role Glow Effects */
        .owner-glow {
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000, 0 0 40px #ff0000;
            animation: bloodPulse 2s infinite;
        }

        .vip-glow {
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700, 0 0 30px #ffd700;
        }

        @keyframes bloodPulse {
            0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
            50% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000; }
            100% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
        }

        /* Doxbin Style Table */
        .doxbin-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            background: var(--bg-color);
            border: 1px solid var(--table-border);
        }

        .doxbin-table thead {
            background: var(--table-header-bg);
        }

        .doxbin-table th {
            padding: 12px 15px;
            text-align: left;
            font-weight: bold;
            color: var(--accent-color);
            border-bottom: 2px solid var(--table-border);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .doxbin-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--table-border);
            font-size: 0.9rem;
        }

        .doxbin-table tbody tr:nth-child(odd) {
            background: var(--table-row-alt);
        }

        .doxbin-table tbody tr:nth-child(even) {
            background: var(--bg-color);
        }

        .doxbin-table tbody tr:hover {
            background: var(--hover-color);
        }

        .doxbin-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Clickable paste links */
        .paste-link {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .paste-link:hover {
            text-decoration: underline;
            color: #6bbfff;
        }

        .paste-title-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            display: block;
        }

        .paste-title-link:hover {
            color: var(--link-color);
            text-decoration: underline;
        }

        /* Share link section */
        .share-section {
            background: var(--table-row-alt);
            padding: 1rem;
            border: 1px solid var(--table-border);
            margin: 1.5rem 0;
            border-radius: 2px;
        }

        .share-link-container {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .share-link {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--table-border);
            padding: 0.8rem;
            color: var(--text-color);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            border-radius: 2px;
            user-select: all;
        }

        .copy-btn {
            background: var(--table-header-bg);
            color: var(--accent-color);
            border: 1px solid var(--table-border);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 2px;
            font-size: 0.9rem;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: var(--hover-color);
            border-color: var(--link-color);
        }

        .copy-btn.copied {
            background: #00aa00;
            border-color: #00aa00;
            color: white;
        }

        /* Comments and Views styling */
        .comments-count, .views-count {
            font-weight: bold;
            color: #888;
            cursor: pointer;
        }

        .comments-count:hover, .views-count:hover {
            color: var(--accent-color);
        }

        /* Badge styling */
        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 2px;
            margin-left: 5px;
            vertical-align: middle;
        }

        .badge-manager {
            background: #ff8800;
            color: white;
        }

        .badge-admin {
            background: #ff0000;
            color: white;
        }

        .badge-vip {
            background: #ffd700;
            color: black;
        }

        .badge-tagmaker {
            background: #8800ff;
            color: white;
        }

        .badge-owner {
            background: #ff0000;
            color: white;
            animation: bloodPulse 2s infinite;
        }

        .badge-pinned {
            background: #00aa00;
            color: white;
        }

        /* Pagination Styles */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2rem 0;
            gap: 0.5rem;
        }

        .pagination-btn {
            background: var(--table-header-bg);
            color: var(--accent-color);
            border: 1px solid var(--table-border);
            width: 36px;
            height: 36px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .pagination-btn:hover:not(:disabled) {
            background: var(--hover-color);
            border-color: var(--link-color);
        }

        .pagination-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pagination-pages {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .page-number {
            background: var(--table-header-bg);
            color: var(--accent-color);
            border: 1px solid var(--table-border);
            width: 36px;
            height: 36px;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: normal;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .page-number:hover {
            background: var(--hover-color);
            border-color: var(--link-color);
        }

        .page-number.active {
            background: var(--link-color);
            color: white;
            border-color: var(--link-color);
        }

        .page-ellipsis {
            color: #888;
            font-size: 1rem;
            margin: 0 0.5rem;
        }

        .pagination-info {
            text-align: center;
            color: #888;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        /* Timeout Fullscreen */
        .timeout-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 2rem;
        }

        .timeout-overlay.active {
            display: flex;
        }

        .timeout-message {
            font-size: 3rem;
            color: #ff0000;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px #ff0000;
            animation: pulse 1.5s infinite;
        }

        .timeout-details {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 3rem;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Navbar */
        .navbar {
            background-color: #000000;
            padding: 0.8rem 1.5rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid var(--table-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
        }

        .hamburger-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.4rem;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hamburger-btn:hover {
            background: var(--hover-color);
            border-radius: 2px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .username-display {
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Slide Down Menu */
        .slide-down-menu {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            background-color: #000000;
            z-index: 999;
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid var(--table-border);
            transition: top 0.5s ease;
        }

        .slide-down-menu.active {
            top: 50px;
        }

        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .menu-btn {
            background: var(--table-header-bg);
            color: var(--accent-color);
            border: 1px solid var(--table-border);
            padding: 0.6rem 1rem;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s;
            width: 100%;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        .menu-btn:hover {
            background: var(--hover-color);
            border-color: var(--link-color);
            transform: translateX(3px);
        }

        .hidden {
            display: none !important;
        }

        /* Main Content */
        .main-content {
            padding-top: 70px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 70px 1.5rem 1.5rem;
            min-height: calc(100vh - 70px);
        }

        /* Logo and Search */
        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--table-border);
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin: 0.8rem auto;
        }

        /* Search Container */
        .search-container {
            max-width: 600px;
            margin: 0 auto 2rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .search-wrapper {
            flex: 1;
            display: flex;
            gap: 0.5rem;
        }

        .search-bar {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid var(--table-border);
            border-radius: 2px;
            background: var(--bg-color);
            color: var(--accent-color);
            font-size: 0.9rem;
            outline: none;
            height: 40px;
        }

        .search-bar::placeholder {
            color: #666;
            font-size: 0.9rem;
        }

        .search-btn {
            padding: 0.8rem 1.5rem;
            background: var(--table-header-bg);
            color: var(--accent-color);
            border: 1px solid var(--table-border);
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: normal;
            height: 40px;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: var(--hover-color);
            border-color: var(--link-color);
        }

        /* Pinned Pastes Section */
        .pinned-pastes {
            margin-bottom: 2rem;
        }

        .pastes-table-container {
            background: var(--bg-color);
            border: 1px solid var(--table-border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.8rem;
        }

        /* Recent Pastes */
        .section-title {
            color: var(--accent-color);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--table-border);
        }

        /* FULLSCREEN PASTE DETAIL */
        .paste-detail-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-color);
            z-index: 9999;
            padding: 15px;
            overflow-y: auto;
            display: none;
        }

        .paste-detail-container.active {
            display: block;
        }

        .paste-detail-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid var(--table-border);
            z-index: 10000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
        }

        .paste-detail-content {
            margin-top: 60px;
            padding: 1.5rem;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-btn {
            background: var(--table-header-bg);
            color: var(--accent-color);
            border: 1px solid var(--table-border);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 2px;
            font-size: 0.9rem;
            transition: all 0.3s;
            height: 36px;
        }

        .back-btn:hover {
            background: var(--hover-color);
            border-color: var(--link-color);
        }

        .paste-content {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            background: var(--bg-color);
            padding: 1.5rem;
            border-radius: 2px;
            border: 1px solid var(--table-border);
            margin-top: 1rem;
            min-height: 150px;
            max-height: calc(100vh - 250px);
            overflow-y: auto;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        /* Forms */
        .paste-form, .auth-form, .profile-form, .timeout-form, .tag-form, .username-color-form {
            max-width: 700px;
            margin: 0 auto;
            background: var(--table-row-alt);
            padding: 1.5rem;
            border-radius: 2px;
            border: 1px solid var(--table-border);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: bold;
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--table-border);
            border-radius: 2px;
            background: var(--bg-color);
            color: var(--accent-color);
            font-size: 0.9rem;
            outline: none;
        }

        .form-textarea {
            min-height: 300px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .url-input-group {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .url-input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid var(--table-border);
            border-radius: 2px;
            background: var(--bg-color);
            color: var(--accent-color);
            font-size: 0.9rem;
        }

        .time-input-group {
            display: flex;
            gap: 0.8rem;
        }

        .time-input {
            flex: 1;
            font-size: 0.9rem;
        }

        /* Buttons */
        .btn {
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 2px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: normal;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            height: 32px;
        }

        .btn-primary {
            background: var(--table-header-bg);
            color: var(--accent-color);
            border: 1px solid var(--table-border);
        }

        .btn-primary:hover {
            background: var(--hover-color);
            border-color: var(--link-color);
        }

        .btn-secondary {
            background: #222222;
            color: var(--accent-color);
            border: 1px solid #666666;
        }

        .btn-secondary:hover {
            background: #333333;
        }

        .btn-danger {
            background: #ff0000;
            color: white;
            border: 1px solid #ff0000;
        }

        .btn-danger:hover {
            background: #cc0000;
        }

        .btn-success {
            background: #00aa00;
            color: white;
            border: 1px solid #00aa00;
        }

        .btn-success:hover {
            background: #008800;
        }

        .btn-warning {
            background: #ffaa00;
            color: black;
            border: 1px solid #ffaa00;
        }

        .btn-warning:hover {
            background: #ff9900;
        }

        .btn-gold {
            background: #ffd700;
            color: #000000;
            border: 1px solid #ffd700;
        }

        .btn-gold:hover {
            background: #ffed4e;
        }

        .btn-group {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.8rem;
        }

        /* Chat Page */
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--table-row-alt);
            border: 1px solid var(--table-border);
            border-radius: 2px;
            height: 500px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: var(--table-header-bg);
            padding: 0.8rem;
            border-bottom: 1px solid var(--table-border);
            text-align: center;
            font-size: 1rem;
            color: var(--accent-color);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem;
            background: var(--bg-color);
        }

        .message {
            margin-bottom: 0.8rem;
            padding: 0.8rem;
            background: var(--table-row-alt);
            border-radius: 2px;
            border-left: 2px solid var(--table-border);
            font-size: 0.9rem;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }

        .message-sender {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 0.85rem;
        }

        .message-time {
            color: #888888;
            font-size: 0.8rem;
        }

        .chat-input-container {
            padding: 0.8rem;
            background: var(--table-header-bg);
            border-top: 1px solid var(--table-border);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 0.8rem;
        }

        .chat-input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid var(--table-border);
            border-radius: 2px;
            background: var(--bg-color);
            color: var(--accent-color);
            font-size: 0.9rem;
            outline: none;
            height: 36px;
        }

        .send-btn {
            padding: 0.8rem 1.5rem;
            background: var(--table-header-bg);
            color: var(--accent-color);
            border: 1px solid var(--table-border);
            border-radius: 2px;
            cursor: pointer;
            font-weight: normal;
            font-size: 0.9rem;
            height: 36px;
        }

        .send-btn:hover {
            background: var(--hover-color);
            border-color: var(--link-color);
        }

        /* Hall of Autism */
        .hall-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 1200px) {
            .hall-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .hall-grid {
                grid-template-columns: 1fr;
            }
        }

        .hall-box {
            background: var(--table-row-alt);
            border: 1px solid var(--table-border);
            border-radius: 2px;
            padding: 1.2rem;
            text-align: center;
            transition: all 0.3s;
        }

        .hall-box:hover {
            transform: translateY(-2px);
            border-color: var(--link-color);
        }

        .hall-image {
            width: 100%;
            height: 150px;
            background: var(--bg-color);
            border: 1px solid var(--table-border);
            margin-bottom: 0.8rem;
            border-radius: 2px;
            overflow: hidden;
        }

        .hall-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hall-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.4rem;
            color: var(--accent-color);
        }

        .hall-description {
            color: #888888;
            font-size: 0.8rem;
        }

        /* Profile Page */
        .profile-banner {
            height: 150px;
            background: var(--bg-color);
            border-radius: 2px;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--table-border);
        }

        .profile-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-picture {
            width: 80px;
            height: 80px;
            background: var(--bg-color);
            position: absolute;
            bottom: -40px;
            left: 1.5rem;
            border: 1px solid var(--table-border);
            border-radius: 2px;
            overflow: hidden;
        }

        .profile-picture-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Admin Panel */
        .admin-controls {
            background: var(--table-row-alt);
            border: 1px solid #ff0000;
