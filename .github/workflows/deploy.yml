name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Create config file
        run: |
          echo "window.FIREBASE_CONFIG = {" > config.js
          echo "  pasteApiKey: '${{ secrets.PASTE_API_KEY }}'," >> config.js
          echo "  pasteAuthDomain: '${{ secrets.PASTE_AUTH_DOMAIN }}'," >> config.js
          echo "  pasteProjectId: '${{ secrets.PASTE_PROJECT_ID }}'," >> config.js
          echo "  pasteStorageBucket: '${{ secrets.PASTE_STORAGE_BUCKET }}'," >> config.js
          echo "  pasteMessagingSenderId: '${{ secrets.PASTE_MESSAGING_SENDER_ID }}'," >> config.js
          echo "  pasteAppId: '${{ secrets.PASTE_APP_ID }}'," >> config.js
          echo "  chatApiKey: '${{ secrets.CHAT_API_KEY }}'," >> config.js
          echo "  chatAuthDomain: '${{ secrets.CHAT_AUTH_DOMAIN }}'," >> config.js
          echo "  chatProjectId: '${{ secrets.CHAT_PROJECT_ID }}'," >> config.js
          echo "  chatStorageBucket: '${{ secrets.CHAT_STORAGE_BUCKET }}'," >> config.js
          echo "  chatMessagingSenderId: '${{ secrets.CHAT_MESSAGING_SENDER_ID }}'," >> config.js
          echo "  chatAppId: '${{ secrets.CHAT_APP_ID }}'" >> config.js
          echo "};" >> config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
